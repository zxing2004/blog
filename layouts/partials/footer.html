<footer class="site-footer">
  <div class="container footer-inner">
    <div class="footer-left">
      <span>&copy; {{ .Site.Params.sinceYear | default (now.Year) }} {{ .Site.Params.author }} · {{ .Site.Title }}</span>
      <span class="sep">·</span>
      <span>由 <a href="https://gohugo.io/" target="_blank" rel="noopener">Hugo</a> 构建</span>
    </div>
    <div class="footer-social">
      {{- with .Site.Params.social.github -}}
        <a href="{{ . }}" target="_blank" rel="noopener" title="GitHub" aria-label="GitHub">GitHub</a>
      {{- end -}}
      {{- with .Site.Params.social.email -}}
        <a href="{{ . }}" title="邮箱" aria-label="邮箱">邮箱</a>
      {{- end -}}
      <a href="{{ "index.xml" | relURL }}" title="订阅更新" aria-label="订阅更新">订阅</a>
    </div>
  </div>
</footer>
