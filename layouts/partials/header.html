<header class="site-header">
  <div class="container header-inner">
    <a class="site-brand" href="{{ "/" | relURL }}">
      <span class="brand-mark">&lt;/&gt;</span>
      <span class="brand-title">{{ .Site.Title }}</span>
    </a>

    <nav class="site-nav" aria-label="主导航">
      {{- range .Site.Menus.main -}}
        <a href="{{ .URL | relURL }}"{{ if $.IsMenuCurrent "main" . }} class="active"{{ end }}>{{ .Name }}</a>
      {{- end -}}
      <a href="{{ "index.xml" | relURL }}" class="nav-rss" title="RSS 订阅" aria-label="RSS 订阅">RSS</a>
      <button id="theme-toggle" class="theme-toggle" type="button" title="切换主题" aria-label="切换深浅主题">
        <span class="icon-sun" aria-hidden="true">☀</span>
        <span class="icon-moon" aria-hidden="true">☾</span>
      </button>
    </nav>

    <button id="nav-toggle" class="nav-toggle" type="button" aria-label="展开菜单" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>
